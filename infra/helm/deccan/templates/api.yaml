apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports: [{ containerPort: 4000 }]
          env:
            - { name: WEB_ORIGIN, value: "https://{{ .Values.host }}" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otlpEndpoint | quote }} }
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          readinessProbe: { httpGet: { path: /health, port: 4000 } }
          livenessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports: [{ port: 4000, targetPort: 4000 }]
