apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deccan
  annotations: { cert-manager.io/cluster-issuer: letsencrypt }
spec:
  tls: [{ hosts: [{{ .Values.host | quote }}], secretName: deccan-tls }]
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - { path: /api/auth, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }
{{- if .Values.listings.enabled }}
          - { path: /trpc, pathType: Prefix, backend: { service: { name: listings, port: { number: 4100 } } } }
{{- end }}
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }
